name: K1.2 r2 Full Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Show environment
        run: |
          python --version
          node --version
          python -m playwright --version
          git rev-parse HEAD

      - name: Check localhost access
        run: |
          python -m http.server 8765 >/tmp/k12-http.log 2>&1 &
          PID=$!
          sleep 2
          curl --fail --show-error http://127.0.0.1:8765/ >/dev/null
          curl --fail --show-error http://localhost:8765/ >/dev/null
          kill $PID
          echo "localhost preflight PASS"

      - name: Run K1.2 full verification
        shell: bash
        run: |
          set -o pipefail
          python -u verify_release.py --full 2>&1 | tee k12-full-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "$EXIT_CODE" > k12-full-exit-code.txt
          echo "verify_release.py --full exit code: $EXIT_CODE"
          exit "$EXIT_CODE"

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k12-r2-full-verification
          path: |
            k12-full-output.txt
            k12-full-exit-code.txt
            SHA256SUMS.txt
          if-no-files-found: ignore
