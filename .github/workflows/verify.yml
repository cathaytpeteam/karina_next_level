# Find Pax — automatic release verification.
# Runs verify_release.py (file integrity, locks, message copy, and the browser-driven
# flow behaviour suite) on every push, every pull request, and on demand.
# Result: GitHub → Actions tab → latest "Find Pax verify" run (green ✓ / red ✗).
# The run's Summary page lists every FAIL line so it can be read on a phone.
name: Find Pax verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Locate app folder
        id: app
        shell: bash
        run: |
          f=$(find . -name verify_release.py -not -path './.git/*' | sort | head -1)
          if [ -z "$f" ]; then echo "verify_release.py not found in repository"; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "App folder: $(dirname "$f")"

      - name: Run verify_release.py
        shell: bash
        working-directory: ${{ steps.app.outputs.dir }}
        run: python verify_release.py 2>&1 | tee "$RUNNER_TEMP/verify-output.txt"

      - name: Write summary
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/verify-output.txt"
          {
            if [ ! -f "$out" ]; then
              echo "## ⚠️ Verification did not run"
            elif grep -q '^FAIL' "$out"; then
              echo "## ❌ Verification failed"
              echo
              echo '```'
              grep -v '^PASS' "$out" | head -150
              echo '```'
            else
              echo "## ✅ All checks passed"
              echo
              echo "$(grep -c '^PASS' "$out") top-level checks passed, including every flow branch, Back/Forward, guards, state rules and send URLs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: ${{ runner.temp }}/verify-output.txt
          if-no-files-found: ignore
