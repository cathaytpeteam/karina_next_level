<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Find Pax</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Find Pax">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  color-scheme:light only;
  --bg:#FFFFFF; --surface:#F1F6F6; --line:#D3DDDE; --ink:#14201F; --muted:#556A6C;
  --brand:#00747A; --brand-strong:#005D63; --brand-soft:#DCEFEF; --on-brand:#FFFFFF;
  --danger:#C62828; --danger-soft:#FBE9E9;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#fff}
body{color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none;touch-action:manipulation}

.app{position:fixed;top:var(--vt,0px);left:0;right:0;height:var(--vh,100%);max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}

.head{flex:none;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;min-height:64px}
.headrow{display:flex;align-items:center;gap:10px;min-height:44px}
.back{border:0;background:transparent;color:var(--brand-strong);font-size:17px;font-weight:700;padding:8px 8px 8px 0;min-width:64px;text-align:left;cursor:pointer}
.back[hidden]{visibility:hidden;display:block}
.who{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.who[hidden]{display:none}
.bar{height:4px;border-radius:2px;background:var(--surface);margin-top:8px;overflow:hidden}
.bar[hidden]{display:none}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s ease}
.step{font-size:14px;color:var(--muted);margin:8px 0 0;min-height:20px}

main{flex:1;overflow-y:auto;padding:12px 20px 24px;-webkit-overflow-scrolling:touch}
.screen[hidden]{display:none}
h1{font-size:28px;line-height:1.2;margin:20px 0 22px;color:var(--brand-strong);font-weight:800;letter-spacing:-.01em}

.foot{flex:none;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.app.kb .foot{padding-bottom:14px}
.foot[hidden]{display:none}
.hint{min-height:22px;margin:0 0 8px;font-size:15px;color:var(--muted);text-align:center}
.hint.bad{color:var(--danger);font-weight:700}
.cta{width:100%;min-height:60px;border:0;border-radius:16px;background:var(--brand);color:var(--on-brand);font-size:20px;font-weight:800;cursor:pointer}
.cta:disabled{opacity:.32;cursor:default}

.field{display:flex;align-items:center;min-height:72px;border:2px solid var(--line);border-radius:16px;background:var(--bg);padding:0 8px;transition:border-color .12s}
.field + .field{margin-top:12px}
.field:focus-within{border-color:var(--brand)}
.field.bad{border-color:var(--danger)}
.plus{font-size:26px;color:var(--brand-strong);padding:0 4px 0 10px}
.field input{border:0;outline:0;background:transparent;width:100%;min-width:0;height:64px;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;padding:0 8px}
.field input::placeholder{color:var(--muted);opacity:.45;font-weight:500}
.field .code{flex:none;width:64px;margin-right:6px;border-radius:12px;background:var(--brand-soft);color:var(--brand-strong);text-align:center;font-weight:800;text-transform:uppercase;height:52px;padding:0}
span.code{display:grid;place-items:center;font-size:28px}
.field.time{min-height:72px}
#phoneInput{font-size:24px;letter-spacing:0}
.field.time input{text-align:center}
.badge{flex:none;background:var(--brand-soft);color:var(--brand-strong);border-radius:10px;padding:5px 9px;font-size:15px;font-weight:800;white-space:nowrap}
.badge[hidden]{display:none}
.warn{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-size:22px;font-weight:800;text-align:center}
.warn.show{display:block}
.chip{width:max-content;margin:-8px auto 22px;padding:6px 18px;border-radius:999px;background:var(--brand-soft);color:var(--brand-strong);font-size:22px;font-weight:800;letter-spacing:.04em}
.chip + .field{margin-top:0}
h1 + .chip{margin-top:-8px}

.choices{display:grid;gap:12px;margin-top:8px}
.choice{display:flex;align-items:center;gap:16px;width:100%;min-height:84px;padding:12px 18px;border:0;border-radius:18px;background:var(--surface);text-align:left;cursor:pointer}
.choice:active{background:var(--brand-soft)}
.ico{flex:none;width:52px;height:52px;border-radius:14px;background:var(--brand-soft);display:grid;place-items:center}
.ico svg{width:32px;height:32px;fill:none;stroke:var(--brand-strong);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ctext{flex:1;font-size:20px;font-weight:800}
.chev{font-size:30px;color:var(--brand-strong)}

.opts{display:grid;gap:12px}
.opt{width:100%;min-height:68px;padding:12px 18px;border:2px solid transparent;border-radius:16px;background:var(--surface);font-size:20px;font-weight:700;text-align:center;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-strong)}
.optExtra{margin-top:14px}
.optExtra[hidden]{display:none}

.bagHelp{margin:-8px 0 20px;font-size:20px;line-height:1.35;font-weight:700;color:var(--brand-strong)}

.sum{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0 0 16px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;font-size:17px}
.sum div + div{border-top:1px solid var(--line)}
.sum dt{color:var(--muted);flex:none}
.sum dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;min-height:48px;border-radius:11px;font-size:17px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--brand-strong);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.msg{background:var(--surface);border-radius:16px;padding:16px;font-size:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
@media(max-height:620px){h1{margin:10px 0 14px;font-size:24px}.field{min-height:60px}.field input{height:54px}.cta{min-height:54px}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="head">
    <div class="headrow">
      <button class="back" id="back" type="button" hidden>‹ Back</button>
      <div class="who" id="who" hidden><span id="whoFlag"></span><span id="whoNum"></span></div>
    </div>
    <div class="bar" id="bar" hidden><i id="barFill"></i></div>
    <p class="step" id="step"></p>
  </header>

  <main id="main">
    <section class="screen" id="s-phone">
      <h1>Input phone number<br>on CTCM</h1>
      <div class="field" id="phoneField">
        <span class="plus">+</span>
        <input id="phoneInput" inputmode="numeric" maxlength="15" placeholder="852 1234 5678" aria-label="Phone number">
        <span class="badge" id="badge" hidden></span>
      </div>
      <div class="warn" id="warn" role="alert">Canned number. Do not use.</div>
    </section>

    <section class="screen" id="s-scenario" hidden>
      <h1>Scenario</h1>
      <div class="choices">
        <button class="choice" id="goMiss" type="button">
          <span class="ico"><svg viewBox="0 0 32 32"><rect x="5" y="9" width="22" height="16" rx="3"/><path d="M12 9V6h8v3M5 17h22"/></svg></span>
          <span class="ctext">1&nbsp; Missed check</span><span class="chev">›</span>
        </button>
        <button class="choice" id="goCall" type="button">
          <span class="ico"><svg viewBox="0 0 32 32"><path d="M8 5l4 5-2 3c2 4 5 7 9 9l3-2 5 4-2 4c-1 1-3 1-5 1C13 27 5 19 4 10c0-2 0-4 1-5z"/></svg></span>
          <span class="ctext">2&nbsp; Call Pax</span><span class="chev">›</span>
        </button>
        <button class="choice" id="goWpp" type="button">
          <span class="ico"><svg viewBox="0 0 32 32"><rect x="3" y="10" width="11" height="9" rx="2"/><rect x="18" y="14" width="11" height="9" rx="2"/><path d="M7 7h9M13 4l3 3-3 3M25 27h-9M19 24l-3 3 3 3"/></svg></span>
          <span class="ctext">3&nbsp; Wrongly Pick-up</span><span class="chev">›</span>
        </button>
        <button class="choice" id="goDp" type="button">
          <span class="ico"><svg viewBox="0 0 32 32"><path d="M4 13l10 2 6-7c1-1 3-1 3 0l-3 8 5 1 2-2 1 1-2 4-6-1-4 6h-2l1-6-6-1-2 3-2-1z"/><circle cx="24" cy="24" r="6"/><path d="M24 21v3l2 1.5"/></svg></span>
          <span class="ctext">4&nbsp; Disrupted Pax</span><span class="chev">›</span>
        </button>
      </div>
    </section>

    <!-- Missed check -->
    <section class="screen" id="s-mflight" hidden>
      <h1>Flight number</h1>
      <div class="field"><span class="code">CX</span><input id="mFlight" inputmode="numeric" maxlength="3" placeholder="000" aria-label="Flight number digits"></div>
    </section>
    <section class="screen" id="s-msec" hidden>
      <h1>SEC</h1>
      <div class="field"><input id="mSec" inputmode="numeric" maxlength="3" placeholder="000" aria-label="SEC number"></div>
    </section>

    <!-- Wrongly Pick-up -->
    <section class="screen" id="s-wflight" hidden>
      <h1>Flight number</h1>
      <div class="field"><span class="code">CX</span><input id="wFlight" inputmode="numeric" maxlength="3" placeholder="000" aria-label="Flight number digits"></div>
    </section>
    <section class="screen" id="s-bag1" hidden>
      <h1>Bag Tag 1</h1>
      <p class="bagHelp">Unclaimed bag</p>
      <div class="field"><input class="code" id="b1a" maxlength="2" value="CX" aria-label="Airline code"><input id="b1n" inputmode="numeric" maxlength="6" placeholder="000000" aria-label="6-digit bag tag number"></div>
    </section>
    <section class="screen" id="s-bag2" hidden>
      <h1>Bag Tag 2</h1>
      <p class="bagHelp">Bag taken by mistake</p>
      <div class="field"><input class="code" id="b2a" maxlength="2" value="CX" aria-label="Airline code"><input id="b2n" inputmode="numeric" maxlength="6" placeholder="000000" aria-label="6-digit bag tag number"></div>
    </section>

    <!-- Disrupted Pax -->
    <section class="screen" id="s-dflight" hidden>
      <h1>Disrupted flight</h1>
      <div class="chip">TPE</div>
      <div class="field"><span class="code">CX</span><input id="dFlight" inputmode="numeric" maxlength="3" placeholder="000" aria-label="Flight number digits"></div>
    </section>
    <section class="screen" id="s-dtransfer" hidden>
      <h1>Connecting flight</h1>
      <div class="chip">HKG</div>
      <div class="field"><input class="code" id="tA" maxlength="2" value="CX" aria-label="Airline code"><input id="tN" inputmode="numeric" maxlength="3" placeholder="000" aria-label="Flight number digits"></div>
    </section>
    <section class="screen" id="s-dstatus" hidden>
      <h1>Flight status</h1>
      <div class="opts">
        <button class="opt" id="stPossible" type="button" aria-pressed="false">May be delayed today</button>
        <button class="opt" id="stDelayed" type="button" aria-pressed="false">Delayed to</button>
        <button class="opt" id="stUnknown" type="button" aria-pressed="false">Not confirmed yet</button>
      </div>
      <div class="optExtra" id="delayWrap" hidden>
        <div class="field time"><input id="delayTime" inputmode="numeric" maxlength="5" placeholder="HHMM" aria-label="Delayed to, HHMM"></div>
      </div>
    </section>
    <section class="screen" id="s-darrange" hidden>
      <h1>Flight arrangement</h1>
      <div class="opts">
        <button class="opt" id="arKnown" type="button" aria-pressed="false">Will protect to</button>
        <button class="opt" id="arUnknown" type="button" aria-pressed="false">Not decided yet</button>
      </div>
      <div class="optExtra" id="altWrap" hidden>
        <div class="field"><input class="code" id="altA" maxlength="2" value="CX" aria-label="Airline code"><input id="altN" inputmode="numeric" maxlength="3" placeholder="000" aria-label="Flight number digits"></div>
        <div class="field time"><input id="altTime" inputmode="numeric" maxlength="5" placeholder="HHMM" aria-label="Departure time, HHMM"></div>
      </div>
    </section>
    <section class="screen" id="s-darrive" hidden>
      <h1>Pax should arrive before ?</h1>
      <div class="field time"><input id="arriveTime" inputmode="numeric" maxlength="5" placeholder="HHMM" aria-label="Arrive before, HHMM"></div>
    </section>

    <!-- shared preview -->
    <section class="screen" id="s-preview" hidden>
      <h1>Confirm and send</h1>
      <dl class="sum" id="sum"></dl>
      <div class="seg" role="group" aria-label="Message order">
        <button type="button" id="ordZh" aria-pressed="true">Chinese first</button>
        <button type="button" id="ordEn" aria-pressed="false">English first</button>
      </div>
      <div class="msg" id="msg"></div>
    </section>
  </main>

  <footer class="foot" id="foot" hidden>
    <p class="hint" id="hint" aria-live="polite"></p>
    <button class="cta" id="cta" type="button" disabled>Next</button>
  </footer>
</div>

<script>
(function(){
  "use strict";
  const $=id=>document.getElementById(id);
  const digits=s=>String(s||"").replace(/\D/g,"");
  const v=id=>$(id).value;

  const blocked=new Set(["85289648964","85262374313"]);
  const countryCodes=[
    ["852","🇭🇰","HK"],["886","🇹🇼","TW"],["853","🇲🇴","MO"],["855","🇰🇭","KH"],["856","🇱🇦","LA"],
    ["880","🇧🇩","BD"],["977","🇳🇵","NP"],["975","🇧🇹","BT"],["960","🇲🇻","MV"],["971","🇦🇪","AE"],
    ["972","🇮🇱","IL"],["974","🇶🇦","QA"],["965","🇰🇼","KW"],["966","🇸🇦","SA"],["968","🇴🇲","OM"],
    ["962","🇯🇴","JO"],["961","🇱🇧","LB"],["973","🇧🇭","BH"],["964","🇮🇶","IQ"],["98","🇮🇷","IR"],
    ["81","🇯🇵","JP"],["82","🇰🇷","KR"],["86","🇨🇳","CN"],["65","🇸🇬","SG"],["60","🇲🇾","MY"],
    ["66","🇹🇭","TH"],["63","🇵🇭","PH"],["62","🇮🇩","ID"],["84","🇻🇳","VN"],["91","🇮🇳","IN"],
    ["94","🇱🇰","LK"],["92","🇵🇰","PK"],["95","🇲🇲","MM"],["976","🇲🇳","MN"],
    ["44","🇬🇧","UK"],["33","🇫🇷","FR"],["49","🇩🇪","DE"],["39","🇮🇹","IT"],["34","🇪🇸","ES"],
    ["351","🇵🇹","PT"],["31","🇳🇱","NL"],["32","🇧🇪","BE"],["41","🇨🇭","CH"],["43","🇦🇹","AT"],
    ["45","🇩🇰","DK"],["46","🇸🇪","SE"],["47","🇳🇴","NO"],["358","🇫🇮","FI"],["353","🇮🇪","IE"],
    ["48","🇵🇱","PL"],["420","🇨🇿","CZ"],["36","🇭🇺","HU"],["30","🇬🇷","GR"],["40","🇷🇴","RO"],
    ["7","🇷🇺","RU"],["380","🇺🇦","UA"],["90","🇹🇷","TR"],
    ["61","🇦🇺","AU"],["64","🇳🇿","NZ"],
    ["1","🇺🇸","US/CA"],["52","🇲🇽","MX"],["55","🇧🇷","BR"],["54","🇦🇷","AR"],["56","🇨🇱","CL"],
    ["57","🇨🇴","CO"],["51","🇵🇪","PE"],
    ["27","🇿🇦","ZA"],["20","🇪🇬","EG"],["234","🇳🇬","NG"],["254","🇰🇪","KE"],["212","🇲🇦","MA"]
  ].sort((a,b)=>b[0].length-a[0].length);
  const findCountry=n=>countryCodes.find(c=>n.startsWith(c[0]));

  // ---- state -------------------------------------------------------------
  const S={phone:"",status:"",arrange:"",order:"zh"};
  try{const o=localStorage.getItem("fp-order");if(o==="en"||o==="zh")S.order=o;}catch(e){}

  const FLOWS={
    miss:{name:"Missed check",steps:["mflight","msec","preview"]},
    wpp:{name:"Wrongly Pick-up",steps:["wflight","bag1","bag2","preview"]},
    dp:{name:"Disrupted Pax",steps:["dflight","dtransfer","dstatus","darrange","darrive","preview"]}
  };
  let flow="", cur="phone", resetting=false;
  const stack=["phone"];

  // ---- validation --------------------------------------------------------
  const isAir=s=>/^[A-Z]{2}$/.test(s);
  const isFlt=s=>/^\d{1,3}$/.test(s);
  function timeState(id){
    const d=digits(v(id));
    if(d.length<4) return d.length?"partial":"empty";
    return (+d.slice(0,2)<=23 && +d.slice(2)<=59)?"ok":"bad";
  }
  const timeOk=id=>timeState(id)==="ok";
  function timeHint(id){
    const t=timeState(id);
    return t==="empty"?"HHMM":t==="partial"?"HHMM, for example 0811":t==="bad"?"Invalid time (00:00–23:59)":"";
  }
  function fmtTime(el){
    const d=digits(el.value).slice(0,4);
    el.value=d.length>=3?d.slice(0,2)+":"+d.slice(2):d;
  }

  const OK={
    phone:()=>{const n=digits(v("phoneInput"));return n.length>=6&&!blocked.has(n);},
    mflight:()=>isFlt(v("mFlight")),
    msec:()=>isFlt(v("mSec"))&&+v("mSec")<=580,
    wflight:()=>isFlt(v("wFlight")),
    bag1:()=>isAir(v("b1a"))&&/^\d{6}$/.test(v("b1n")),
    bag2:()=>isAir(v("b2a"))&&/^\d{6}$/.test(v("b2n")),
    dflight:()=>isFlt(v("dFlight")),
    dtransfer:()=>isAir(v("tA"))&&isFlt(v("tN")),
    dstatus:()=>S.status==="delayed"&&timeOk("delayTime"),
    darrange:()=>S.arrange==="known"&&isAir(v("altA"))&&isFlt(v("altN"))&&timeOk("altTime"),
    darrive:()=>timeOk("arriveTime"),
    preview:()=>true
  };
  function bagHint(a,n){
    if(!isAir(v(a))) return "Airline code: 2 letters";
    const l=v(n).length; return l<6?(l?(6-l)+" more digits":"6 digits"):"";
  }
  const HINT={
    phone:()=>{const n=digits(v("phoneInput"));if(blocked.has(n))return "Canned number";return n.length&&n.length<6?"At least 6 digits ("+(6-n.length)+" more)":"";},
    mflight:()=>isFlt(v("mFlight"))?"":"1–3 digits",
    msec:()=>{const x=v("mSec");return !x?"0–580":(+x>580?"Max 580":"");},
    wflight:()=>isFlt(v("wFlight"))?"":"1–3 digits",
    bag1:()=>bagHint("b1a","b1n"),
    bag2:()=>bagHint("b2a","b2n"),
    dflight:()=>isFlt(v("dFlight"))?"":"1–3 digits",
    dtransfer:()=>!isAir(v("tA"))?"Airline code: 2 letters":(isFlt(v("tN"))?"":"1–3 digits"),
    dstatus:()=>timeHint("delayTime"),
    darrange:()=>!isAir(v("altA"))?"Airline code: 2 letters":(!isFlt(v("altN"))?"1–3 digits":timeHint("altTime")),
    darrive:()=>timeHint("arriveTime"),
    preview:()=>"Check details before sending"
  };
  const NEXT={
    phone:()=>{S.phone=digits(v("phoneInput"));go("scenario");},
    mflight:()=>go("msec"), msec:()=>go("preview"),
    wflight:()=>go("bag1"), bag1:()=>go("bag2"), bag2:()=>go("preview"),
    dflight:()=>go("dtransfer"), dtransfer:()=>go("dstatus"),
    dstatus:()=>go("darrange"), darrange:()=>go("darrive"), darrive:()=>go("preview"),
    preview:()=>send()
  };

  // ---- messages ----------------------------------------------------------
  function dateCode(){
    const d=new Date();
    return String(d.getDate()).padStart(2,"0")+["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"][d.getMonth()];
  }
  function textMiss(zhFirst){
    const tag="cx"+String(Number(v("mFlight")))+"/sec"+String(Number(v("mSec"))).padStart(3,"0")+"/"+dateCode();
    const zh=`您好：

這是國泰航空桃園機場辦公室。

由於您的行李未能通過桃園機場的X光檢查，機場安檢人員需要與您一起進行第二次檢查，因此行李目前暫時留於報到櫃檯而無法裝載，請您返回4號報到櫃台與我們職員聯繫。

如您已經通過隨身行李安全檢查但尚未通過護照檢查，請您先告知現場桃園機場工作人員，並返回櫃檯確認寄艙行李，若您已通過護照檢查，請與任何在登機閘口的國泰職員聯繫。

請您儘速返回櫃檯或是聯繫國泰職員，以確保行李能在航班啟程前順利裝載，謝謝您的配合。`;
    const en=`Hello, this is Cathay Pacific at Taoyuan Airport.

Your checked baggage did not pass the X-ray screening at the check-in counter, and airport security needs to conduct a second inspection with you. Your baggage is therefore being held at the counter and cannot be loaded at this time.

Please return to Check-in Counter 4 and contact our staff.

If you have passed security but not immigration, please inform the airport staff and return to the counter. If you have passed immigration, please contact our staff at the boarding gate.

Please contact us as soon as possible so we can arrange for your baggage to be loaded before departure. Thank you for your cooperation.`;
    return (zhFirst?zh+"\n\n"+en:en+"\n\n"+zh)+"\n\n"+tag;
  }
  function textWpp(zhFirst){
    const flight="CX"+v("wFlight"), bag1=v("b1a")+v("b1n"), bag2=v("b2a")+v("b2n");
    const zh=`您好：

這是桃園機場國泰航空行李辦公室。

我們發現一件搭乘 ${flight} 抵達台北後無人領取的行李，該行李的行李牌號碼 ${bag1} 登記於您的名下。

目前另有一名旅客正在尋找一件外觀相似的行李。

請您協助確認您所領取的行李，其行李牌號碼是否為 ${bag2}？

您也可以直接拍攝您所領取行李的行李牌照片並傳送給我們確認。

為了避免耽誤您的行程，請您務必儘速聯絡我們，以確保您拿到的是正確的行李。

Email: tpe8bag@cathaypacific.com
Tel: +88627727630

謝謝您的配合。`;
    const en=`Hello,

This is the Cathay Pacific Baggage Services Office at Taoyuan Airport.

We found one piece of unclaimed baggage from ${flight} arriving in Taipei. The baggage tag number ${bag1} is registered under your name.

Another passenger is currently looking for a similar bag.

Could you please confirm whether the baggage you collected has the baggage tag number ${bag2}?

You may also simply take a photo of the baggage tag on the bag you collected and send it to us for verification.

To avoid any disruption to your journey, please contact us as soon as possible so that we can ensure you have collected the correct baggage.

Email: tpe8bag@cathaypacific.com
Tel: +88627727630

Thank you for your cooperation.`;
    return zhFirst?zh+"\n\n"+en:en+"\n\n"+zh;
  }
  function textDp(zhFirst){
    const f="CX"+v("dFlight"), tf=v("tA")+v("tN"), delay=v("delayTime"), alt=v("altA")+v("altN"), altTime=v("altTime"), arrive=v("arriveTime");
    let zStatus,eStatus;
    if(S.status==="possible"){zStatus="今天可能會延遲";eStatus="may be delayed today";}
    else if(S.status==="delayed"){zStatus="目前已經延遲至"+delay;eStatus="is currently delayed until "+delay;}
    else{zStatus="目前航班及起飛動態尚未確定";eStatus="has a current status and departure time that have not yet been confirmed";}
    let zArrange,eArrange;
    if(S.arrange==="known"){
      zArrange=`我們將會替您安排替代的航班${alt}，起飛時間為${altTime}，`;
      eArrange=`We will arrange an alternative flight ${alt}, departing at ${altTime}.`;
    }else{
      zArrange="我們將會為您安排替代的航班，";
      eArrange="We will arrange an alternative flight for you.";
    }
    const zh=`您好：

這裡是國泰航空桃園機場辦公室

由於您前往香港的${f}航班，${zStatus}，因此會影響到您在香港轉機的行程 ${tf} 航班，${zArrange}想請問您是否有辦法於${arrive}前抵達桃園機場？我們在第一航廈4號櫃檯，請您到達機場後直接與我們櫃台同事聯繫。`;
    const first=S.status==="unknown"
      ?`The current status and departure time of your flight ${f} to Hong Kong have not yet been confirmed, which may affect your onward connection ${tf} in Hong Kong.`
      :`Your flight ${f} to Hong Kong ${eStatus}, which may affect your onward connection ${tf} in Hong Kong.`;
    const en=`Hello,

This is Cathay Pacific at Taoyuan Airport.

${first}

${eArrange}

Could you please let us know if you are able to arrive at Taoyuan Airport before ${arrive}?

We are located at Counter 4, Terminal 1. Please contact our staff at the counter directly when you arrive at the airport.

Thank you.`;
    return zhFirst?zh+"\n\n"+en:en+"\n\n"+zh;
  }
  function buildText(){
    const zf=S.order==="zh";
    return flow==="miss"?textMiss(zf):flow==="wpp"?textWpp(zf):textDp(zf);
  }
  function buildRows(){
    const rows=[["To","+"+S.phone]];
    if(flow==="miss"){
      rows.push(["Flight","CX"+String(Number(v("mFlight")))],["SEC",String(Number(v("mSec"))).padStart(3,"0")]);
    }else if(flow==="wpp"){
      rows.push(["Flight","CX"+v("wFlight")],["Bag Tag 1",v("b1a")+v("b1n")],["Bag Tag 2",v("b2a")+v("b2n")]);
    }else if(flow==="dp"){
      rows.push(["Disrupted flight","CX"+v("dFlight")],["Connecting flight",v("tA")+v("tN")]);
      rows.push(["Status",S.status==="possible"?"May be delayed today":S.status==="delayed"?"Delayed to "+v("delayTime"):"Not confirmed yet"]);
      rows.push(["Arrangement",S.arrange==="known"?v("altA")+v("altN")+"  "+v("altTime"):"Not decided yet"]);
      rows.push(["Arrive before",v("arriveTime")]);
    }
    return rows;
  }

  // ---- WhatsApp ----------------------------------------------------------
  function openWA(text){
    const url="https://wa.me/"+S.phone+"?text="+encodeURIComponent(text);
    const a=document.createElement("a");
    a.href=url;a.target="_blank";a.rel="noopener";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(resetAll,700);
  }
  function send(){ openWA(buildText()); }

  // ---- navigation --------------------------------------------------------
  function showScreen(id){
    cur=id;
    document.querySelectorAll(".screen").forEach(s=>s.hidden=true);
    $("s-"+id).hidden=false;
    render();
    $("main").scrollTop=0;
  }
  function focusFirst(id){
    const inp=$("s-"+id).querySelector("input:not(.code)");
    if(inp&&inp.offsetParent!==null){try{inp.focus({preventScroll:true});}catch(e){inp.focus();}}
  }
  function go(id){
    stack.push(id);
    try{history.pushState({},"");}catch(e){}
    showScreen(id);
    focusFirst(id);
  }
  window.addEventListener("popstate",()=>{
    if(resetting){resetting=false;return;}
    if(stack.length>1){stack.pop();showScreen(stack[stack.length-1]);}
  });
  $("back").onclick=()=>{
    if(stack.length<=1) return;
    const len=stack.length;
    try{history.back();}catch(e){}
    setTimeout(()=>{if(stack.length===len){stack.pop();showScreen(stack[stack.length-1]);}},350);
  };

  function resetAll(){
    document.querySelectorAll("input").forEach(i=>i.value="");
    ["b1a","b2a","tA","altA"].forEach(id=>$(id).value="CX");
    S.phone="";S.status="";S.arrange="";flow="";
    $("badge").hidden=true;
    $("warn").classList.remove("show");
    $("phoneField").classList.remove("bad");
    const depth=stack.length-1;
    stack.length=0;stack.push("phone");
    if(depth>0){resetting=true;try{history.go(-depth);}catch(e){resetting=false;}}
    showScreen("phone");
  }

  // ---- render ------------------------------------------------------------
  function render(){
    const hasWho=cur!=="phone"&&S.phone;
    $("back").hidden=cur==="phone";
    $("who").hidden=!hasWho;
    if(hasWho){
      const c=findCountry(S.phone);
      $("whoFlag").textContent=c?c[1]:"";
      $("whoNum").textContent="+"+S.phone;
    }
    const f=flow&&FLOWS[flow], idx=f?f.steps.indexOf(cur):-1;
    $("bar").hidden=idx<0;
    if(idx>=0){
      $("barFill").style.width=((idx+1)/f.steps.length*100)+"%";
      $("step").textContent=f.name+"  "+(idx+1)+" / "+f.steps.length;
    }else $("step").textContent="";

    // status / arrange option state
    if(cur==="dstatus"){
      $("stPossible").setAttribute("aria-pressed",S.status==="possible");
      $("stDelayed").setAttribute("aria-pressed",S.status==="delayed");
      $("stUnknown").setAttribute("aria-pressed",S.status==="unknown");
      $("delayWrap").hidden=S.status!=="delayed";
    }
    if(cur==="darrange"){
      $("arKnown").setAttribute("aria-pressed",S.arrange==="known");
      $("arUnknown").setAttribute("aria-pressed",S.arrange==="unknown");
      $("altWrap").hidden=S.arrange!=="known";
    }
    if(cur==="preview"){
      const sum=$("sum");sum.textContent="";
      buildRows().forEach(r=>{
        const d=document.createElement("div"),t=document.createElement("dt"),dd=document.createElement("dd");
        t.textContent=r[0];dd.textContent=r[1];d.appendChild(t);d.appendChild(dd);sum.appendChild(d);
      });
      $("ordZh").setAttribute("aria-pressed",S.order==="zh");
      $("ordEn").setAttribute("aria-pressed",S.order==="en");
      $("msg").textContent=buildText();
    }

    const showFoot=!(cur==="scenario"||(cur==="dstatus"&&S.status!=="delayed")||(cur==="darrange"&&S.arrange!=="known"));
    $("foot").hidden=!showFoot;
    const ok=OK[cur]?OK[cur]():false;
    const hint=$("hint");
    hint.textContent=HINT[cur]?HINT[cur]():"";
    hint.classList.toggle("bad",cur==="phone"&&blocked.has(digits(v("phoneInput"))));
    const cta=$("cta");
    cta.disabled=!ok;
    cta.textContent=cur==="preview"?"Send on WhatsApp":"Next";
  }
  $("cta").onclick=function(){ if(!this.disabled&&NEXT[cur]) NEXT[cur](); };

  // ---- wiring ------------------------------------------------------------
  $("phoneInput").addEventListener("input",function(){
    this.value=digits(this.value);
    const c=findCountry(this.value),b=$("badge");
    if(c){b.hidden=false;b.textContent=c[1]+" "+c[2];}else b.hidden=true;
    const bl=blocked.has(this.value);
    $("warn").classList.toggle("show",bl);
    $("phoneField").classList.toggle("bad",bl);
    render();
  });
  const numInputs={mFlight:3,mSec:3,wFlight:3,b1n:6,b2n:6,dFlight:3,tN:3,altN:3};
  Object.keys(numInputs).forEach(id=>$(id).addEventListener("input",function(){this.value=digits(this.value).slice(0,numInputs[id]);render();}));
  ["b1a","b2a","tA","altA"].forEach(id=>$(id).addEventListener("input",function(){this.value=this.value.replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,2);render();}));
  ["delayTime","altTime","arriveTime"].forEach(id=>$(id).addEventListener("input",function(){fmtTime(this);render();}));

  $("goMiss").onclick=()=>{flow="miss";go("mflight");};
  $("goCall").onclick=()=>{flow="";openWA("您好");};
  $("goWpp").onclick=()=>{flow="wpp";go("wflight");};
  $("goDp").onclick=()=>{flow="dp";go("dflight");};

  $("stPossible").onclick=()=>{S.status="possible";go("darrange");};
  $("stUnknown").onclick=()=>{S.status="unknown";go("darrange");};
  $("stDelayed").onclick=()=>{S.status="delayed";render();try{$("delayTime").focus();}catch(e){}};
  $("arUnknown").onclick=()=>{S.arrange="unknown";go("darrive");};
  $("arKnown").onclick=()=>{S.arrange="known";render();try{$("altN").focus();}catch(e){}};

  function setOrder(o){S.order=o;try{localStorage.setItem("fp-order",o);}catch(e){}render();}
  $("ordZh").onclick=()=>setOrder("zh");
  $("ordEn").onclick=()=>setOrder("en");

  document.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&e.target&&e.target.tagName==="INPUT"&&!$("cta").disabled&&!$("foot").hidden){e.preventDefault();$("cta").click();}
  });

  // reduce browser autofill / keyboard suggestions
  document.querySelectorAll("input").forEach(el=>{
    el.setAttribute("autocomplete","off");
    el.setAttribute("autocorrect","off");
    el.setAttribute("autocapitalize","off");
    el.setAttribute("spellcheck","false");
  });

  // keep the Next button above the on-screen keyboard
  const vv=window.visualViewport;
  if(vv){
    const sync=()=>{
      const open=vv.height<window.innerHeight-120;
      const app=$("app");
      app.classList.toggle("kb",open);
      app.style.setProperty("--vh",open?vv.height+"px":"100%");
      app.style.setProperty("--vt",open?vv.offsetTop+"px":"0px");
      const el=document.activeElement;
      if(open&&el&&el.tagName==="INPUT"&&el.scrollIntoView) el.scrollIntoView({block:"center"});
    };
    vv.addEventListener("resize",sync);
    vv.addEventListener("scroll",sync);
  }

  showScreen("phone");
  window.__fp={S,stack,go,get cur(){return cur;}}; // handy for debugging
})();

if("serviceWorker" in navigator){
  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});
      await reg.update();
    }catch(e){}
  });
}
</script>
</body>
</html>
