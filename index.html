<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>漏查 LATE</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#005D63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="漏查">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
:root{
  --green:#005D63;
  --green-soft:#DFF2F2;
  --text:#101927;
  --muted:#46586B;
  --border:#D0D8E0;
  --choice1:#DDF2F2;
  --choice2:#EEF3F7;
  --white:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--text);font-family:Roboto,Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;overflow:hidden}
button,input{font:inherit}
.page{
  min-height:100vh;min-height:100dvh;
  display:none;
  flex-direction:column;
  background:#fff;
  padding:clamp(76px,14vh,132px) 22px calc(18px + env(safe-area-inset-bottom,0px));
}
.page.active{display:flex}
.top{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.title{
  color:var(--green);
  font-size:clamp(25px,6.2vw,32px);
  line-height:1.12;
  font-weight:800;
  margin:0 0 24px;
  letter-spacing:-.55px;
}
.icon{
  width:88px;height:88px;border-radius:50%;
  background:var(--green-soft);
  display:grid;place-items:center;
  margin:0 0 24px;
}
.icon svg{
  width:46px;height:46px;
  fill:none;stroke:var(--green);
  stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round;
}
.icon .fill{fill:var(--green);stroke:none}
.form{width:100%;max-width:440px;margin:0 auto}
.row{display:flex;align-items:center}
.field{
  flex:1;height:62px;border:1.5px solid var(--border);
  border-radius:12px;background:#fff;display:flex;align-items:center;overflow:hidden;
}
.inPrefix{
  padding-left:18px;padding-right:4px;
  font-size:20px;font-weight:800;color:var(--green);
}
input{
  width:100%;height:100%;border:0;outline:0;background:transparent;
  padding:0 17px;font-size:20px;color:var(--text);
}
input::placeholder{color:#A9B1BA}
.next{
  width:100%;height:58px;margin-top:14px;border:0;border-radius:12px;
  background:var(--green);color:#fff;font-size:20px;font-weight:800;
}
.next:disabled{opacity:.30}

/* Phone: + is visually inside the field */
#phone .top{flex-direction:column-reverse}
#phone .title{margin:0 0 24px}
#phone .icon{margin:0 0 24px}
#phone .prefixOutside{
  width:58px;height:62px;margin-right:-58px;z-index:2;
  display:grid;place-items:center;
  border-right:1px solid #E0E5EA;
  font-size:30px;font-weight:400;color:var(--green);
}
#phone .field{padding-left:58px}

/* Scenario: intentionally no heading or top icon */
#scenario{
  justify-content:flex-start;
  padding-top:clamp(178px,28vh,250px);
}
#scenario .top{display:none}
.choices{
  width:100%;max-width:440px;margin:0 auto;
  display:grid;gap:16px;
}
.choice{
  width:100%;height:92px;border:0;border-radius:16px;
  display:grid;grid-template-columns:64px 1fr 28px;
  align-items:center;padding:0 22px;
  color:var(--green);
}
.choice.one{background:var(--choice1)}
.choice.two{background:var(--choice2)}
.choiceIcon{
  width:48px;height:48px;display:grid;place-items:center;color:var(--green);
}
.choiceIcon svg{width:44px;height:44px;fill:currentColor}
.choiceText{
  display:flex;align-items:baseline;justify-content:center;gap:18px;
  font-size:25px;font-weight:800;letter-spacing:-.3px;
}
.choiceText .num{font-size:28px}
.chev{
  font-size:44px;line-height:1;font-weight:400;transform:translateY(-2px);
}

/* Flight / SEC use the same lower, balanced vertical rhythm */
#flight .top,#sec .top{margin-top:6px}
#flight .title,#sec .title{margin-bottom:24px}
#flight .form,#sec .form{margin-top:0}

.spacer{flex:1}
@media(max-height:650px){
  .page{padding-top:58px}
  #scenario{padding-top:112px}
  .icon{width:70px;height:70px;margin-bottom:18px}
  .icon svg{width:38px;height:38px}
  .title{font-size:23px;margin-bottom:18px}
  .field{height:54px}
  #phone .prefixOutside{height:54px}
  .next{height:52px}
  .choice{height:78px}
}
</style>

</head>
<body>

<section id="phone" class="page active">
  <div class="top">
    <h1 class="title">Input phone number<br>on CTCM</h1>
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M7 4l2.2 4.5-2.1 1.7c1.3 3 3.6 5.3 6.6 6.6l1.7-2.1L20 17l-.9 3.1c-.2.8-.9 1.3-1.7 1.3C9.2 21.4 2.6 14.8 2.6 6.6c0-.8.5-1.5 1.3-1.7z"/></svg>
    </div>
  </div>
  <div class="form">
    <div class="row">
      <div class="prefixOutside">+</div>
      <div class="field"><input id="phoneInput" inputmode="numeric" maxlength="15" autocomplete="tel" placeholder="852 1234 5678"></div>
    </div>
    <button id="phoneNext" class="next" disabled>Next</button>
  </div>
  <div class="spacer"></div>
</section>

<section id="scenario" class="page">
  <div class="top"></div>
  <div class="choices">
    <button id="missBtn" class="choice one" aria-label="1 漏查">
      <span class="choiceIcon" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M22 15V9c0-3.3 2.7-6 6-6h8c3.3 0 6 2.7 6 6v6h8c4.4 0 8 3.6 8 8v27c0 4.4-3.6 8-8 8H14c-4.4 0-8-3.6-8-8V23c0-4.4 3.6-8 8-8h8zm5 0h10V9c0-.6-.4-1-1-1h-8c-.6 0-1 .4-1 1v6zM17 20h-3c-1.7 0-3 1.3-3 3v27c0 1.7 1.3 3 3 3h3V20zm30 0v33h3c1.7 0 3-1.3 3-3V23c0-1.7-1.3-3-3-3h-3z"/>
        </svg>
      </span>
      <span class="choiceText"><span class="num">1</span><span>漏查</span></span>
      <span class="chev" aria-hidden="true">›</span>
    </button>
    <button id="callBtn" class="choice two" aria-label="2 Call Pax">
      <span class="choiceIcon" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M18.1 7.8c1.8-1.8 4.7-1.8 6.5 0l7.1 7.1c1.5 1.5 1.8 3.9.6 5.7l-4.2 6.3c3.2 6.1 8.2 11.1 14.3 14.3l6.3-4.2c1.8-1.2 4.2-.9 5.7.6l7.1 7.1c1.8 1.8 1.8 4.7 0 6.5l-4.4 4.4c-3 3-7.5 4-11.5 2.5C25.8 50.8 13.2 38.2 5.9 18.4c-1.5-4-.5-8.5 2.5-11.5l4.4-4.4 5.3 5.3z"/>
          <path d="M39 8c8.8 1.7 15.3 8.2 17 17h-6.2c-1.5-5.4-5.4-9.3-10.8-10.8V8zm0 11.3c4.1 1.3 7.4 4.6 8.7 8.7h-6.5c-.6-1.1-1.1-1.6-2.2-2.2v-6.5z"/>
        </svg>
      </span>
      <span class="choiceText"><span class="num">2</span><span>Call Pax</span></span>
      <span class="chev" aria-hidden="true">›</span>
    </button>
  </div>
  <div class="spacer"></div>
</section>

<section id="flight" class="page">
  <div class="top">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path class="fill" d="M21.5 14.8v-2.1l-8.1-4.9V3.6c0-1.2-.7-2.1-1.6-2.1s-1.6.9-1.6 2.1v4.2l-8.1 4.9v2.1l8.1-2.4v5.2l-2.4 1.8V21l4-1.1 4 1.1v-1.6l-2.4-1.8v-5.2z"/>
      </svg>
    </div>
    <h1 class="title">flight number</h1>
  </div>
  <div class="form">
    <div class="row">
      <div class="prefixOutside"></div>
      <div class="field"><span class="inPrefix">CX</span><input id="flightInput" inputmode="numeric" maxlength="3"></div>
    </div>
    <button id="flightNext" class="next" disabled>Next</button>
  </div>
  <div class="spacer"></div>
</section>

<section id="sec" class="page">
  <div class="top">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M7 3h8l3 3v15H7z"/><path d="M15 3v4h4M10 11h5M10 15h5"/></svg>
    </div>
    <h1 class="title">sec</h1>
  </div>
  <div class="form">
    <div class="row">
      <div class="prefixOutside"></div>
      <div class="field"><input id="secInput" inputmode="numeric" maxlength="3"></div>
    </div>
    <button id="secNext" class="next" disabled>Next</button>
  </div>
  <div class="spacer"></div>
</section>

<script>
(function(){
  let phone="", flight="", current="phone";
  const $=id=>document.getElementById(id);
  const digits=s=>String(s||"").replace(/\D/g,"");

  try{history.replaceState({page:"phone"},"","#phone");}catch(e){}

  function show(id, push=true, focus=true){
    current=id;
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    $(id).classList.add("active");
    if(push){try{history.pushState({page:id},"","#"+id);}catch(e){}}
    if(focus){
      setTimeout(()=>{
        const inp=$(id).querySelector("input");
        if(inp) inp.focus();
      },80);
    }
  }

  window.addEventListener("popstate",e=>{
    const id=(e.state&&e.state.page)||"phone";
    current=id;
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    $(id).classList.add("active");
  });

  function dateCode(){
    const d=new Date();
    const dd=String(d.getDate()).padStart(2,"0");
    const m=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"][d.getMonth()];
    return dd+m;
  }

  function resetAll(){
    phone="";flight="";
    document.querySelectorAll("input").forEach(i=>i.value="");
    document.querySelectorAll(".next").forEach(b=>b.disabled=true);
    show("phone",false,false);
    try{history.replaceState({page:"phone"},"","#phone");}catch(e){}
  }

  function openWA(text){
    const url="https://wa.me/+"+phone+"?text="+encodeURIComponent(text);
    const a=document.createElement("a");
    a.href=url;a.target="_blank";a.rel="noopener";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(resetAll,700);
  }

  $("phoneInput").addEventListener("input",function(){
    this.value=digits(this.value);
    $("phoneNext").disabled=this.value.length<6;
  });
  $("phoneNext").onclick=function(){
    phone=digits($("phoneInput").value);
    if(phone.length>=6) show("scenario",true,false);
  };

  $("missBtn").onclick=()=>show("flight",true,true);
  $("callBtn").onclick=()=>openWA("您好");

  $("flightInput").addEventListener("input",function(){
    this.value=digits(this.value).slice(0,3);
    const n=this.value===""?-1:Number(this.value);
    $("flightNext").disabled=!(n>=0&&n<=999);
  });
  $("flightNext").onclick=function(){
    const n=Number($("flightInput").value);
    if(n>=0&&n<=999){flight=String(n);show("sec",true,true)}
  };

  $("secInput").addEventListener("input",function(){
    this.value=digits(this.value).slice(0,3);
    const n=this.value===""?-1:Number(this.value);
    $("secNext").disabled=!(n>=0&&n<=580);
  });
  $("secNext").onclick=function(){
    const n=Number($("secInput").value);
    if(!(n>=0&&n<=580)) return;
    const sec=String(n).padStart(3,"0");
    const tag="cx"+flight+"/sec"+sec+"/"+dateCode();
    openWA('您好：\n\n這是國泰航空桃園機場辦公室。\n\n由於您的行李未能通過桃園機場的X光檢查，機場安檢人員需要與您一起進行第二次檢查，因此行李目前暫時留於報到櫃檯而無法裝載，請您返回4號報到櫃台與我們職員聯繫。\n\n如您已經通過隨身行李安全檢查但尚未通過護照檢查，請您先告知現場桃園機場工作人員，並返回櫃檯確認寄艙行李，若您已通過護照檢查，請與任何在登機閘口的國泰職員聯繫。\n\n請您儘速返回櫃檯或是聯繫國泰職員，以確保行李能在航班啟程前順利裝載，謝謝您的配合。\n\nHello, this is Cathay Pacific at Taoyuan Airport.\n\nYour checked baggage did not pass the X-ray screening at the check-in counter, and airport security needs to conduct a second inspection with you. Your baggage is therefore being held at the counter and cannot be loaded at this time.\n\nPlease return to Check-in Counter 4 and contact our staff.\n\nIf you have passed security but not immigration, please inform the airport staff and return to the counter. If you have passed immigration, please contact our staff at the boarding gate.\n\nPlease contact us as soon as possible so we can arrange for your baggage to be loaded before departure. Thank you for your cooperation.\n\n'+tag);
  };
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
